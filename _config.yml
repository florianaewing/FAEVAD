title: Florian Anthony Ewing
description: >-
  Original ink paintings and drawings by Seattle-based visual artist and
  designer Florian Anthony Ewing — prints and framed originals.

# Venmo checkout (buy-<id>.html): the shipping/size/color form submits to
# formspree_endpoint (so you get the order details by email) and only then
# reveals a Venmo pay link pre-filled with an order code, to venmo_username.
# There's no way to force a payment to include the code — a buyer could
# still open Venmo directly — so this is a strong nudge, not a guarantee.
# Reconcile incoming Venmo payments against the Formspree emails by that
# code.
venmo_username: "TheFlorian"
formspree_endpoint: "https://formspree.io/f/maeyrkkj"

# Bitcoin checkout (bitcoin-<id>.html): same gated-form pattern as Venmo, but
# the invoice itself (fixed BTC amount, locked ~15 min) has to be created via
# an authenticated API call, so it's proxied through a small Cloudflare
# Worker (cloudflare/bitcoin-invoice-worker/) that holds the OpenNode secret
# key server-side. bitcoin_worker_endpoint is a placeholder until that
# Worker is deployed — see cloudflare/bitcoin-invoice-worker/wrangler.toml.
#
# On hold as of 2026-09-15: OpenNode requires the account to be verified as
# a registered business before it'll pay out, which hasn't happened yet.
# Everything is built and ready (Worker, pages, form) but bitcoin_enabled
# stays false — and the "Continue with Bitcoin" button stays hidden from
# buy-<id>.html — until that's resolved, so no visitor hits a dead-end form.
# To go live: register the business (or switch to self-hosted BTCPay Server,
# which needs no business verification — see chat history), deploy the
# Worker, set bitcoin_worker_endpoint to its real URL below, then flip
# bitcoin_enabled to true.
bitcoin_enabled: false
bitcoin_worker_endpoint: "https://REPLACE_ME.workers.dev"

exclude:
  - README.md
  - cloudflare/
