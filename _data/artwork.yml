# Catalogue data, grouped by collection. work.html renders this automatically —
# to add a new piece, add an entry under the right collection's `pieces` list;
# to add a whole new collection (e.g. a future ceramics series), add another
# entry under `collections` with its own `slug`, `title`, `intro`, and `pieces`.
#
# Per piece:
#   id, title, medium, year, image, alt  — same as before.
#
#   description  free text shown on the piece's own page (piece-<id>.html).
#                Leave "" to hide the description section — fill these in
#                whenever you have time, no other change needed.
#
#   print:     reproductions, sold in three sizes. Always buyable while
#     available: true, so there's no "sold" state for prints — they can be
#     reprinted any number of times.
#       available    true while print editions are offered at all
#       currency     ISO code (only "USD" is rendered with a $ sign today)
#       format       optional; "cards" for greeting cards instead of prints
#                    (no backing color; each tier needs a `description`)
#       tiers        one entry per size — size, price (number, no symbol),
#                    and stripe_link. Leave a tier's stripe_link blank to
#                    show "Coming soon" instead of a Buy button for that
#                    size on the piece's buy page (buy-<id>.html).
#
#   original:  the one physical piece. One-time purchase, ships framed, and
#     is gone once sold — so it DOES get a "sold" label. Price isn't listed;
#     the page always shows "Available upon request" and links to an email
#     inquiry, unless stripe_link is set (e.g. once a price is agreed), in
#     which case that replaces the inquiry link with a direct Buy link.
#       status       "available" | "sold" | "unavailable"
#       stripe_link  optional — leave blank to show "Inquire" instead

