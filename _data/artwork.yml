  - slug: watercolors
    title: "Watercolors"
    intro:
      description: >
        I created this collection in my spare time. Usually during the evenings my partner spent
        watching reality tv shows I wasn't particularly interested in. There's something special
        about creating a new world for yourself and being drawn into it. As hard as I tried to
        distract myself, I still know more about ANTM than I ever thought I would. Turns out
        watching paint dry doesn't have to be boring.

