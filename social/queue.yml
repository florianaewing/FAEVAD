# Daily social posting queue.
#
# catalog_number determines posting order — the Telegram bot walks pieces in
# this order, one per day, starting from 1. Every piece here must already be
# live on the site (in _data/artwork.yml with working Stripe print links)
# before it can be queued — the daily post is always of something currently
# purchasable, never a preview of unpublished work.
#
# posted / post_date / platforms are written by the bot itself after
# posting — instagram/pinterest go via Buffer. Reddit and Facebook
# Marketplace are NOT part of this automated flow: neither has a usable
# free/hobbyist posting API as of 2026 (Reddit closed personal-script token
# approval; Marketplace never had one for individual sellers). Both are
# parked as a later headless-browser-automation phase, done knowingly with
# the ToS-violation/ban risk accepted — see the roadmap memory. Nothing
# here should be hand-edited except to add new entries as new pieces go
# live on the site.
#
# New pieces get appended here (next catalog_number) by the backlog
# cataloguing sync script once they've been added to _data/artwork.yml and
# gotten their Stripe links — not before.

