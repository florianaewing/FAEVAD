- id: art-about-agriculture
  name: Art About Agriculture Open Call (Oregon State University)
  where: Touring exhibition around Oregon
  url: https://agsci.oregonstate.edu/art
  eligibility: Pacific Northwest artists (WA, OR, ID, MT, AK, BC, HI)
  media: Fine art and craft about food, fiber and natural resources
  fee: Free
  opens: 2026-11-15
  opens_estimated: true
  deadline: ~2027-01-11
  notes: >-
    Themed: the work has to relate to agriculture, food, fiber or natural
