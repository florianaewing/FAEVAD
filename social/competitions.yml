- id: strokes-of-genius
  name: "Strokes of Genius: The Best of Drawing"
  where: Artists Network (international, published in a book/magazine)
  url: https://www.artistsnetwork.com/art-competitions/strokes
  eligibility: 18+, worldwide
  media: Drawing -- check that pen and ink counts (rules say "dry medium traditionally considered drawing")
