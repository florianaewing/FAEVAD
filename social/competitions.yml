# Art competitions the bot reminds the artist about on Telegram (see
# bot/competitions.py). For each approved competition it sends two messages,
# both at noon Pacific: one 14 days before submissions open, and one on the
# day they open.
#
# Only entries with `approved: true` get reminders; the artist approves them.
# `opens_estimated: true` means the date is a guess from past years' calls,
# not announced yet -- the reminder says so. Once a call is announced, set
# the real date and change it to false. After a competition opens, move
# `opens` (and `deadline`) to next year's call so it comes up again.
#
# Every competition here takes digital submissions (photos of the work) for
# jurying. Some ask for the original to be shipped or delivered if accepted;
# `notes` says so.

- id: gallery-110-international
  name: Gallery 110 Annual International Juried Exhibition
  where: Seattle, WA (Pioneer Square)
  url: https://gallery110.com
  eligibility: Open to artists worldwide
  media: All media
  fee: $40 for up to 3 images, +$10 per extra image
  opens: 2027-07-21
  opens_estimated: true
  deadline: ~2027-10-31
  notes: >-
    The 2026 call (16th) is open now until 2026-10-31; show Feb 4-27, 2027.
    Prizes $1,000 / $500 / $300 + $200 People's Choice. Accepted work is
    delivered or shipped to the gallery.
  approved: true

- id: cvg-show
  name: CVG Show
  where: Collective Visions Gallery, Bremerton, WA
  url: https://www.cvgshow.com
  eligibility: Washington and Oregon artists
  media: Photography/digital, 2D, 3D
  fee: See the CaFE listing
  opens: 2027-08-18
  opens_estimated: true
  deadline: ~2027-11-07
  notes: >-
    The 2027 show's call is open now until 2026-11-07. Up to $10,000 in cash
    and purchase prizes. Blind jurying. Entries through CaFE.
  approved: true

- id: nwws-international-open
  name: Northwest Watercolor Society Annual International Open
  where: Northwest Watercolor Society (Seattle area); online exhibition
  url: https://nwws.org/annual-international-open/
  eligibility: Artists in the US and internationally; no membership needed
  media: Water media (watercolor, gouache, acrylic, mixed water media)
  fee: See the prospectus (2022 non-member fee was $40)
  opens: 2027-05-01
  opens_estimated: true
  deadline: ~2027-07-08
  notes: >-
    Entries open in May each year for about 60 days. Over $14,000 in awards
    in 2026. Watercolors only.
  approved: true

- id: anacortes-juried-fine-art
  name: Anacortes Arts Festival Juried Fine Art Exhibition
  where: Depot Art Center, Anacortes, WA
  url: https://www.anacortesartsfestival.com
  eligibility: Washington state artists
  media: All 2D and 3D media (no AI-generated work)
  fee: $35
  opens: 2027-01-09
  opens_estimated: true
  deadline: ~2027-03-12
  notes: >-
