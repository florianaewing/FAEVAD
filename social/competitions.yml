# Art competitions the bot reminds the artist about on Telegram (see
# bot/competitions.py). Every approved competition gets four reminders, all
# at noon Pacific: 14 days before submissions open, the day they open, 14
# days before the deadline, and the deadline day. Reminders whose date has
# already passed are skipped.
#
# Each entry is ONE application period: `opens` and `deadline` are that
# call's dates. `deadline` is the last full day to apply (a deadline at noon
# counts as the day before). `deadline_reminder` replaces the
# two-weeks-before date when the deadline is too close for that.
# `opens_estimated: true` means the dates are guessed from past years.
# Once a call closes, move the entry to the next call's dates.
#
# Only entries with `approved: true` get reminders; the artist approves them.
# `year` is the edition's year as the organizer names it, used in the
# opening-day message; leave it out when that's just the year it opens.
#
# Every competition here takes digital submissions (photos of the work) for
# jurying. Some ask for the original to be shipped or delivered if accepted;
# `notes` says so.
- id: gallery-110-international
  name: Gallery 110 Annual International Juried Exhibition
  where: Seattle, WA (Pioneer Square)
  url: https://gallery110.com
  eligibility: Open to artists worldwide
  media: All media
  fee: $40 for up to 3 images, +$10 per extra image
  year: 2027
  opens: 2026-07-21
  opens_estimated: false
  deadline: 2026-10-31
  deadline_reminder: 2026-10-26
  notes: >-
    The 2026 call (16th) is open now until 2026-10-31; show Feb 4-27, 2027.
    Prizes $1,000 / $500 / $300 + $200 People's Choice. Accepted work is
    delivered or shipped to the gallery.
  approved: true

